format_version: 3.5.5
name: unifi
title: "Ubiquiti UniFi"
version: 0.2.34
source:
  license: "Apache-2.0"
description: "Elastic Agent integration for Ubiquiti UniFi products. Collects syslog events from UniFi devices and metrics from UniFi Network Application API including device health, port statistics, radio metrics, WiFi SSIDs, and connected clients."
type: integration
categories:
  - network
  - security
  - observability
conditions:
  kibana:
    version: "^9.0.8"
  elastic:
    subscription: "basic"
screenshots:
  - src: /img/sample-screenshot.png
    title: Sample screenshot
    size: 600x600
    type: image/png
icons:
  - src: /img/icon.svg
    title: UniFi logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: unifi
    title: UniFi Logs and Metrics
    description: |
      Collect logs and metrics from UniFi devices.

      **Logs**: Syslog events from UniFi devices (firewall, IPS, authentication, etc.)

      **Metrics**: Performance data from UniFi Network Application API:
      - Device Metrics: Core device health, CPU, memory, traffic
      - Port Metrics: Per-port statistics for switches
      - Radio Metrics: Per-radio metrics for access points
      - VAP Metrics: Per-SSID WiFi network statistics
      - Client Metrics: Connected client signal and traffic data
    inputs:
      - type: filestream
        title: UniFi Syslog Events (Logs)
        description: Collect syslog data from UniFi devices via file or syslog server
      - type: cel
        title: UniFi Network Metrics (API)
        description: |
          Collect metrics from UniFi Network Application API using CEL (Common Expression Language).

          Enable individual metric streams based on your needs:
          - Device Metrics: Essential for all deployments
          - Port Metrics: For switch monitoring
          - Radio Metrics: For WiFi radio performance
          - VAP Metrics: For per-SSID monitoring
          - Client Metrics: For end-user experience tracking

          Each stream can be independently enabled and configured.
owner:
  github: elastic/integrations
  type: community
