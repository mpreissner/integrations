# newer versions go on top
- version: "0.2.29"
  changes:
    - description: Initialize cursor as empty map in state section to fix "no such key cursor" error. Cursor must exist in initial state to be returned in response.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.28"
  changes:
    - description: Fixed state persistence by returning full state object (api_key, controller_host, site_name, url) in CEL response, not just cursor. The returned state becomes the state for next iteration.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.27"
  changes:
    - description: Fixed state persistence between polling intervals by returning cursor in CEL response. State must be explicitly returned to persist across iterations. This fixes "no such key site_name" errors on subsequent polls.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.26"
  changes:
    - description: Fixed device_metrics cpu/mem conversion using correct Go stdlib replace signature with 4 parameters. Changed to string(field).replace(' ', '', -1) where -1 means replace all occurrences. Elastic CEL uses mito library with Go strings package.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.25"
  changes:
    - description: Fixed device_metrics cpu/mem conversion using replace() to remove whitespace from string values before converting to double. Changed to string(field).replace(' ', '') pattern since trim() not available on dynamic types.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.24"
  changes:
    - description: Fixed device_metrics cpu/mem conversion by calling trim() method directly on string fields (e.g. device["system-stats"].cpu.trim()) before converting to double. UniFi API returns values with whitespace that prevented conversion.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.23"
  changes:
    - description: Simplified device_metrics cpu/mem conversion to use double() directly without trim (CEL does not have trim method). Testing if double() can parse strings with whitespace.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.22"
  changes:
    - description: Fixed device_metrics type conversion error by trimming whitespace from system-stats cpu and mem strings before converting to double. UniFi API returns values with leading/trailing spaces (e.g. "  2.2", " 80.5").
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.21"
  changes:
    - description: Fixed device_metrics CEL runtime error by converting system-stats cpu and mem string values to numbers using double() before division. UniFi API returns these values as strings (e.g. "1.6", "34.5") which must be converted to numeric types.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.20"
  changes:
    - description: Added quotes to api_key in state section for consistent string handling across all CEL data streams.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.19"
  changes:
    - description: Fixed CEL runtime error in device_metrics by properly checking nested field existence before accessing system-stats.cpu and system-stats.mem fields.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.18"
  changes:
    - description: Fixed CEL syntax error in device_metrics caused by extra closing parenthesis in CPU and memory percentage calculations.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.17"
  changes:
    - description: Fixed CEL division operator type mismatch error in device_metrics for CPU and memory percentage calculations. Corrected parentheses to ensure ternary operator is fully evaluated before division.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.16"
  changes:
    - description: Fixed CEL has() macro syntax errors by replacing invalid `has(object["field"])` pattern with correct `"field" in object` pattern for all hyphenated field names. The has() macro in CEL only accepts field accessors, not bracket notation.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.15"
  changes:
    - description: Fixed CEL syntax errors for fields with hyphens in names. Replaced invalid `.?["field-name"].orValue()` pattern with proper `has()` checks and ternary operators for all hyphenated field names across all data streams.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.14"
  changes:
    - description: Migrated all 5 metric data streams from HTTPJSON to CEL (Common Expression Language) input for better performance, maintainability, and native support for nested array flattening. CEL provides cleaner syntax, built-in array iteration with .map() and .flatten(), and eliminates the need for complex JavaScript processors.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.13"
  changes:
    - description: Fixed critical bug where JavaScript processors were trying to emit multiple events but only one would reach Elasticsearch. Replaced with proper split processor pattern for port_metrics, radio_metrics, and vap_metrics streams. This ensures all port/radio/VAP events are properly ingested instead of being dropped.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.12"
  changes:
    - description: Fixed JSON path parsing errors in device_metrics stream caused by mixed bracket and dot notation in value_type json transforms
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
    - description: Added missing device.mac dimension field to port_metrics base-fields.yml for TSDS routing
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.11"
  changes:
    - description: Restructured metrics collection into 5 specialized data streams (device_metrics, port_metrics, radio_metrics, vap_metrics, client_metrics) to solve document drop issues caused by field count limits. Each stream now extracts only necessary fields (~50-150 per stream vs 2,876), normalizes hyphenated field names, and uses common ECS fields for cross-index queries. Removed old monolithic metrics data stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
    - description: Fixed field count limit issues where UniFi device documents exceeded Elasticsearch 1,000 field default limit, causing silent document drops
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
    - description: Fixed field type conflicts across device types by normalizing data per stream
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
    - description: Set client_metrics data stream to disabled by default due to high data volume (one document per client per interval)
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.10"
  changes:
    - description: Testing TSDS dimension field with literal value to diagnose template issue
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.9"
  changes:
    - description: Fixed template value quoting in response transforms
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.8"
  changes:
    - description: Added dimension fields extraction in httpjson response transforms to fix TSDS routing errors
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.7"
  changes:
    - description: Simplified httpjson configuration to basic request without chain for debugging
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.6"
  changes:
    - description: Fixed httpjson template syntax to access split array item fields directly using [[.name]] instead of [[.last_response.body.name]]
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.5"
  changes:
    - description: Fixed template field references in chain step 1 and removed fail_on_template_error flags causing parsing errors
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.4"
  changes:
    - description: Added required top-level request.url field to httpjson configuration to resolve missing field error
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.3"
  changes:
    - description: Fixed httpjson configuration to remove invalid top-level request.url causing HTML response errors
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.2"
  changes:
    - description: Fixed invalid nested split configuration in metrics stream causing agent health issues
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.1"
  changes:
    - description: Fixed package manifest to include httpjson input type for metrics data stream
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.2.0"
  changes:
    - description: Added metrics data stream for UniFi Network Application with support for device performance metrics, port statistics, radio/VAP metrics, gateway WAN/LAN separation, PDU power monitoring, and optional client metrics. Uses official API key authentication for UniFiOS devices (UDM, UDR, UXG, UCG, UDW, Cloud Key Gen2+).
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: "0.1.6"
  changes:
    - description: Added UniFi Overview Dashboard with activity timeline, event type distribution, top firewall rules, and top active devices visualizations
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
    - description: Enhanced firewall event.type detection to include additional block/deny keywords (block, Block, reject, Deny) for improved categorization of denied traffic
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
    - description: Removed saved searches that are not currently used by any dashboards
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: "0.1.5"
  changes:
    - description: Reserved version number (not released)
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: "0.1.4"
  changes:
    - description: Added granular event.action categorization for DNS queries, DHCP events, VPN connections, RADIUS authentication, switch operations, and AP/gateway operational logs. Firewall events now differentiate between allow/deny actions instead of generic firewall_rule.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: "0.1.3"
  changes:
    - description: Expanded gateway device type detection to include systemd, sshd, and cron messages without PIDs
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.1.2"
  changes:
    - description: Fixed gateway device type detection to include kernel messages without PIDs
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: "0.1.1"
  changes:
    - description: Added Kibana data view and four saved searches (Firewall Blocks, IPS Events, WiFi Auth Failures, Link Status Changes) for common monitoring tasks
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: "0.1.0"
  changes:
    - description: Initial release of Ubiquiti UniFi integration for Elastic with syslog data stream. Includes automatic device type detection and parsing for Network (access points, switches, gateways, firewalls) and Protect devices with comprehensive ECS field mapping.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
